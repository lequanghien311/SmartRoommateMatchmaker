apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-roommate-api
  namespace: smart-roommate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-roommate-api
  template:
    metadata:
      labels:
        app: smart-roommate-api
    spec:
      serviceAccountName: smart-roommate
      containers:
        - name: api
          image: REPLACE_ACR.azurecr.io/smart-roommate:REPLACE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smart-roommate-config
            - secretRef:
                name: smart-roommate-secrets
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health/database, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10

