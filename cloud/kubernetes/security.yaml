apiVersion: v1
kind: ServiceAccount
metadata:
  name: smart-roommate
  namespace: smart-roommate
  annotations:
    azure.workload.identity/client-id: REPLACE_MANAGED_IDENTITY_CLIENT_ID
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-roommate-default
  namespace: smart-roommate
spec:
  podSelector:
    matchLabels:
      app: smart-roommate-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector: {}
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }

